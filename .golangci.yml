version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - errorlint
  settings:
    gosec:
      excludes:
        - G402 # InsecureSkipVerify is an explicit, opt-in -insecure flag
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec] # fixture URLs with dummy credentials (G101)

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
